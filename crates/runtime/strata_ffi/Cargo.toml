[package]
name = "strata_ffi"
version = "0.1.0"
edition = "2021"
authors = ["larvance <64753457+larvance@users.noreply.github.com>"]
description = "Universal C-compatible Foreign Function Interface (FFI) and embeddable dynamic library for Strata"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
strata = { workspace = true }
strata_dom = { workspace = true }
strata_style = { workspace = true }
strata_render = { workspace = true }
