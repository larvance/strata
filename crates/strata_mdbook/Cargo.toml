[package]
name = "strata_mdbook"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Strata mdBook interactive documentation preprocessor for live runnable RSX widgets"

[[bin]]
name = "mdbook-strata"
path = "src/main.rs"

[lib]
name = "strata_mdbook"
path = "src/lib.rs"

[dependencies]
strata_codegen_js = { path = "../strata_codegen_js" }
strata_style = { path = "../strata_style" }
strata_js = { path = "../strata_js" }
