[package]
name = "strata_parity_tauri"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Parity Verification Harness between Strata Pure Rust Engine and Tauri WebKitGTK"

[dependencies]
strata = { workspace = true, features = ["mobile-test"] }
strata_dom = { workspace = true }
strata_style = { workspace = true }
strata_layout = { workspace = true }
strata_render = { workspace = true }
strata_platform = { workspace = true }
strata_mobile_test = { workspace = true }
tauri = { version = "2.1.1" }
gtk = "0.18.2"
cairo-rs = "0.18.5"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
tauri-build = { version = "2.1.1" }
