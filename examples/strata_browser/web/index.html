<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strata Native Zero-Chromium Browser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    .theme-dark {
      --vp-bg: #09090b;
      --vp-text: #e4e4e7;
      --vp-card: #18181b;
      --vp-border: #27272a;
    }
    .theme-amoled {
      --vp-bg: #000000;
      --vp-text: #d4d4d8;
      --vp-card: #09090b;
      --vp-border: #18181b;
    }
    .theme-sepia {
      --vp-bg: #fbf0d9;
      --vp-text: #5f4b32;
      --vp-card: #f2e5c9;
      --vp-border: #e0d3bc;
    }
    .theme-light {
      --vp-bg: #ffffff;
      --vp-text: #334155;
      --vp-card: #f8fafc;
      --vp-border: #e2e8f0;
    }
  </style>
</head>
<body class="bg-neutral-950 text-white select-none">
  <div id="browser-root" class="flex flex-col h-screen w-screen overflow-hidden">
    <!-- Top Tab Strip -->
    <div class="flex items-center gap-1.5 px-3 pt-2 bg-neutral-950 border-b border-neutral-800/80">
      <div class="flex items-center gap-1.5 mr-3 pl-1">
        <div class="w-3 h-3 rounded-full bg-rose-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
        <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
      </div>
      <div id="tab-list" class="flex items-center gap-1 overflow-x-auto flex-1 min-w-0"></div>
      <button id="btn-new-tab" class="p-1.5 rounded-lg hover:bg-neutral-800 text-neutral-400 hover:text-white transition-colors cursor-pointer ml-1" title="New Tab">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      </button>
    </div>

    <!-- Navigation & Omnibox Bar -->
    <div class="flex flex-col bg-neutral-900 border-b border-neutral-800">
      <div class="flex items-center gap-2 px-3 py-2">
        <button id="btn-back" class="p-1.5 rounded-lg transition-colors cursor-pointer text-neutral-300 hover:text-white hover:bg-neutral-800 disabled:text-neutral-600 disabled:pointer-events-none" title="Back">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="btn-forward" class="p-1.5 rounded-lg transition-colors cursor-pointer text-neutral-300 hover:text-white hover:bg-neutral-800 disabled:text-neutral-600 disabled:pointer-events-none" title="Forward">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
        <button id="btn-reload" class="p-1.5 rounded-lg text-neutral-300 hover:text-white hover:bg-neutral-800 transition-colors cursor-pointer" title="Reload">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <button id="btn-home" class="p-1.5 rounded-lg text-neutral-300 hover:text-white hover:bg-neutral-800 transition-colors cursor-pointer" title="Home">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        </button>

        <!-- Omnibox URL Bar -->
        <div class="flex-1 flex items-center bg-neutral-950 border border-neutral-700/80 rounded-lg px-3 py-1.5 focus-within:border-blue-500 transition-colors">
          <div id="url-security-icon" class="flex items-center mr-2 text-emerald-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </div>
          <input id="omnibox-input" type="text" class="flex-1 bg-transparent border-0 outline-none text-xs text-white placeholder-neutral-500 font-mono" placeholder="Enter URL or search query...">
          <button id="btn-go" class="px-2.5 py-0.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded transition-colors cursor-pointer ml-2 flex items-center gap-1">
            <span>Go</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
          </button>
        </div>

        <!-- Theme Switcher Pills -->
        <div class="flex items-center gap-1 p-0.5 rounded-lg bg-neutral-950 border border-neutral-800 text-xs">
          <button class="theme-btn px-2 py-1 rounded transition-colors cursor-pointer bg-neutral-800 text-white font-medium" data-theme="dark">Dark</button>
          <button class="theme-btn px-2 py-1 rounded transition-colors cursor-pointer text-neutral-400 hover:text-neutral-200" data-theme="amoled">Amoled</button>
          <button class="theme-btn px-2 py-1 rounded transition-colors cursor-pointer text-neutral-400 hover:text-neutral-200" data-theme="sepia">Sepia</button>
        </div>
      </div>

      <!-- Bookmarks Strip -->
      <div class="flex items-center gap-2 px-3 py-1 bg-neutral-950/60 border-t border-neutral-800/60 text-xs text-neutral-400 overflow-x-auto">
        <span class="text-neutral-500 font-mono text-xs uppercase tracking-wider pl-1">Bookmarks:</span>
        <button class="bm-btn flex items-center gap-1.5 px-2 py-0.5 rounded hover:bg-neutral-800 hover:text-white transition-colors cursor-pointer" data-url="strata://newtab">
          <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <span>Google</span>
        </button>
        <button class="bm-btn flex items-center gap-1.5 px-2 py-0.5 rounded hover:bg-neutral-800 hover:text-white transition-colors cursor-pointer" data-url="https://en.wikipedia.org/wiki/Rust_(programming_language)">
          <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
          <span>Wikipedia: Rust</span>
        </button>
        <button class="bm-btn flex items-center gap-1.5 px-2 py-0.5 rounded hover:bg-neutral-800 hover:text-white transition-colors cursor-pointer" data-url="https://news.ycombinator.com">
          <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3"/></svg>
          <span>Hacker News</span>
        </button>
        <button class="bm-btn flex items-center gap-1.5 px-2 py-0.5 rounded hover:bg-neutral-800 hover:text-white transition-colors cursor-pointer" data-url="https://strata.larvance.com">
          <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          <span>Strata Docs</span>
        </button>
        <button class="bm-btn flex items-center gap-1.5 px-2 py-0.5 rounded hover:bg-neutral-800 hover:text-white transition-colors cursor-pointer" data-url="strata://about">
          <svg class="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>About</span>
        </button>
      </div>
    </div>

    <!-- Viewport Container -->
    <div id="viewport-container" class="flex-1 flex flex-col min-h-0 w-full overflow-y-auto custom-scroll bg-neutral-950"></div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between h-7 px-4 bg-neutral-950 border-t border-neutral-800/80 text-xs font-mono text-neutral-400 select-none">
      <div class="flex items-center gap-2 truncate max-w-md">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="status-url" class="text-neutral-300 truncate">strata://newtab</span>
      </div>
      <div class="hidden sm:flex items-center gap-1.5 text-neutral-500">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        <span>Strata Native Engine (Zero Chromium)</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="status-tabs" class="text-neutral-400">Tabs: 1</span>
        <span class="text-neutral-600">|</span>
        <span class="text-emerald-400">Memory: &lt; 2.8 MB</span>
        <span class="text-neutral-600">|</span>
        <span class="text-blue-400">120 FPS VSync</span>
      </div>
    </div>
  </div>

  <script>
    // Browser State Model
    const state = {
      nextTabId: 2,
      activeTabId: 1,
      theme: 'dark',
      tabs: [
        {
          id: 1,
          title: 'New Tab',
          url: 'strata://newtab',
          history: ['strata://newtab'],
          historyIndex: 0
        }
      ]
    };

    function activeTab() {
      return state.tabs.find(t => t.id === state.activeTabId) || state.tabs[0];
    }

    function canGoBack() {
      const tab = activeTab();
      return tab && tab.historyIndex > 0;
    }

    function canGoForward() {
      const tab = activeTab();
      return tab && tab.historyIndex + 1 < tab.history.length;
    }

    function navigate(raw) {
      let target = raw.trim();
      if (!target) return;

      if (target === 'strata://newtab' || target === 'about:blank' || target === 'strata://about') {
        // As-is
      } else if (target.startsWith('http://') || target.startsWith('https://')) {
        // As-is
      } else if (target.includes('.') && !target.includes(' ')) {
        target = 'https://' + target;
      } else {
        target = 'https://www.google.com/search?q=' + encodeURIComponent(target);
      }

      const tab = activeTab();
      if (!tab) return;

      tab.url = target;
      tab.title = resolveTitle(target);
      if (tab.historyIndex + 1 < tab.history.length) {
        tab.history = tab.history.slice(0, tab.historyIndex + 1);
      }
      tab.history.push(target);
      tab.historyIndex = tab.history.length - 1;

      render();
    }

    function resolveTitle(url) {
      if (url === 'strata://newtab' || url === 'about:blank') return 'New Tab';
      if (url === 'strata://about') return 'About Strata Browser';
      if (url.includes('google.com/search')) {
        const params = new URLSearchParams(url.split('?')[1] || '');
        return (params.get('q') || 'Search') + ' - Google Search';
      }
      if (url.includes('wikipedia.org')) return 'Rust (programming language) - Wikipedia';
      if (url.includes('news.ycombinator.com')) return 'Hacker News';
      if (url.includes('strata.larvance.com')) return 'Strata Engine Documentation';
      return 'Web Page - ' + url.replace(/^https?:\/\//, '');
    }

    function newTab(url = 'strata://newtab') {
      const id = state.nextTabId++;
      const tab = {
        id,
        title: resolveTitle(url),
        url,
        history: [url],
        historyIndex: 0
      };
      state.tabs.push(tab);
      state.activeTabId = id;
      render();
    }

    function closeTab(id) {
      if (state.tabs.length <= 1) {
        state.tabs[0].url = 'strata://newtab';
        state.tabs[0].title = 'New Tab';
        state.tabs[0].history = ['strata://newtab'];
        state.tabs[0].historyIndex = 0;
        render();
        return;
      }

      const idx = state.tabs.findIndex(t => t.id === id);
      if (state.activeTabId === id) {
        if (idx + 1 < state.tabs.length) {
          state.activeTabId = state.tabs[idx + 1].id;
        } else if (idx > 0) {
          state.activeTabId = state.tabs[idx - 1].id;
        }
      }
      state.tabs = state.tabs.filter(t => t.id !== id);
      render();
    }

    function switchTab(id) {
      state.activeTabId = id;
      render();
    }

    function goBack() {
      const tab = activeTab();
      if (tab && tab.historyIndex > 0) {
        tab.historyIndex--;
        tab.url = tab.history[tab.historyIndex];
        tab.title = resolveTitle(tab.url);
        render();
      }
    }

    function goForward() {
      const tab = activeTab();
      if (tab && tab.historyIndex + 1 < tab.history.length) {
        tab.historyIndex++;
        tab.url = tab.history[tab.historyIndex];
        tab.title = resolveTitle(tab.url);
        render();
      }
    }

    // Render Function
    function render() {
      const tab = activeTab();
      const tabList = document.getElementById('tab-list');
      const omnibox = document.getElementById('omnibox-input');
      const btnBack = document.getElementById('btn-back');
      const btnForward = document.getElementById('btn-forward');
      const statusUrl = document.getElementById('status-url');
      const statusTabs = document.getElementById('status-tabs');
      const secIcon = document.getElementById('url-security-icon');
      const viewport = document.getElementById('viewport-container');

      // Update Navigation State
      omnibox.value = tab ? tab.url : 'strata://newtab';
      statusUrl.textContent = tab ? tab.url : 'strata://newtab';
      statusTabs.textContent = 'Tabs: ' + state.tabs.length;
      btnBack.disabled = !canGoBack();
      btnForward.disabled = !canGoForward();

      // Update Security Icon
      if (tab.url.startsWith('strata://')) {
        secIcon.className = 'flex items-center mr-2 text-blue-400';
      } else if (tab.url.startsWith('https://')) {
        secIcon.className = 'flex items-center mr-2 text-emerald-400';
      } else {
        secIcon.className = 'flex items-center mr-2 text-neutral-400';
      }

      // Render Tabs
      tabList.innerHTML = '';
      state.tabs.forEach(t => {
        const isActive = t.id === state.activeTabId;
        const div = document.createElement('div');
        div.className = `group flex items-center gap-2 h-9 px-3.5 rounded-t-lg border-t border-x transition-colors cursor-pointer max-w-[200px] min-w-[120px] ${
          isActive
            ? 'bg-neutral-900 border-neutral-700/80 text-white'
            : 'bg-neutral-950 border-transparent text-neutral-400 hover:text-neutral-200 hover:bg-neutral-900/60'
        }`;
        div.onclick = () => switchTab(t.id);

        let iconSvg = '<svg class="w-3.5 h-3.5 text-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>';
        if (t.url.startsWith('strata://newtab') || t.url.includes('google.com')) {
          iconSvg = '<svg class="w-3.5 h-3.5 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>';
        } else if (t.url.includes('wikipedia.org')) {
          iconSvg = '<svg class="w-3.5 h-3.5 text-indigo-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>';
        } else if (t.url.includes('ycombinator.com')) {
          iconSvg = '<svg class="w-3.5 h-3.5 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3"/></svg>';
        } else if (t.url.includes('strata.larvance.com')) {
          iconSvg = '<svg class="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>';
        }

        div.innerHTML = `
          ${iconSvg}
          <span class="truncate text-xs font-medium flex-1">${t.title}</span>
          <button class="tab-close p-0.5 rounded hover:bg-neutral-700/70 text-neutral-400 hover:text-white transition-colors cursor-pointer ml-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        `;
        div.querySelector('.tab-close').onclick = (e) => {
          e.stopPropagation();
          closeTab(t.id);
        };
        tabList.appendChild(div);
      });

      // Render Viewport
      if (tab.url === 'strata://newtab' || tab.url === 'about:blank') {
        renderGoogleNewTab(viewport);
      } else if (tab.url.includes('google.com/search')) {
        renderGoogleSearchResults(viewport, tab.url);
      } else if (tab.url.includes('wikipedia.org')) {
        renderWikipediaArticle(viewport);
      } else if (tab.url.includes('news.ycombinator.com')) {
        renderHackerNews(viewport);
      } else if (tab.url.includes('strata.larvance.com')) {
        renderStrataDocs(viewport);
      } else if (tab.url === 'strata://about') {
        renderStrataAbout(viewport);
      } else {
        renderGenericPage(viewport, tab.url);
      }
    }

    // Google New Tab View
    function renderGoogleNewTab(container) {
      container.className = 'flex-1 flex flex-col items-center justify-center min-h-[calc(100vh-140px)] w-full px-4 py-12 select-none overflow-y-auto bg-neutral-950 text-white';
      container.innerHTML = `
        <div class="flex flex-col items-center mb-8">
          <div class="flex items-center text-6xl sm:text-7xl font-bold tracking-tight select-none">
            <span class="text-blue-500">G</span>
            <span class="text-red-500">o</span>
            <span class="text-amber-400">o</span>
            <span class="text-blue-500">g</span>
            <span class="text-emerald-500">l</span>
            <span class="text-red-500">e</span>
          </div>
          <div class="mt-2 text-xs font-mono uppercase tracking-widest text-neutral-500">
            Strata Native Zero-Chromium Edition
          </div>
        </div>

        <div class="w-full max-w-2xl bg-neutral-900/90 border border-neutral-700/80 hover:border-neutral-500 focus-within:border-blue-500 rounded-full px-5 py-3 flex items-center gap-3 shadow-xl transition-all">
          <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="google-search-input" type="text" class="flex-1 bg-transparent border-0 outline-none text-white text-base placeholder-neutral-500 font-sans" placeholder="Search Google or type a URL">
          <button id="google-search-btn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-full transition-colors cursor-pointer">
            Search
          </button>
        </div>

        <div class="flex items-center gap-3 mt-7">
          <button id="btn-google-search-action" class="px-5 py-2.5 bg-neutral-800/80 hover:bg-neutral-700 text-neutral-200 hover:text-white text-sm font-medium rounded-lg border border-neutral-700/60 transition-all cursor-pointer shadow-sm">
            Google Search
          </button>
          <button id="btn-lucky-action" class="px-5 py-2.5 bg-neutral-800/80 hover:bg-neutral-700 text-neutral-200 hover:text-white text-sm font-medium rounded-lg border border-neutral-700/60 transition-all cursor-pointer shadow-sm">
            I'm Feeling Lucky
          </button>
        </div>

        <div class="grid grid-cols-3 sm:grid-cols-5 gap-4 mt-12 max-w-2xl w-full">
          <button class="shortcut-tile flex flex-col items-center gap-2 p-3.5 rounded-2xl bg-neutral-900/50 hover:bg-neutral-800/80 border border-neutral-800 hover:border-neutral-700 transition-all cursor-pointer group" data-url="https://en.wikipedia.org/wiki/Rust_(programming_language)">
            <div class="w-11 h-11 rounded-full bg-neutral-800 group-hover:bg-indigo-600/20 group-hover:text-indigo-400 flex items-center justify-center text-neutral-300 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
            </div>
